server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Application à page unique : toute route inconnue rend index.html, qui
    # se charge du routage côté navigateur.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # APK mis à disposition des centres.
    #
    # Volontairement sans authentification : l'agent doit pouvoir installer
    # l'application avant d'avoir un compte, et l'APK ne contient aucune
    # donnée — il faut se connecter pour en voir la moindre.
    #
    # Une page d'accueil remplace la liste brute de nginx : « arm64-v8a »
    # contre « armeabi-v7a » ne veut rien dire pour un responsable de centre,
    # et Android refuse par défaut d'installer hors magasin, ce qu'il faut
    # expliquer.
    location /telechargement/ {
        alias /usr/share/nginx/html/telechargement/;
        index index.html;
        autoindex off;

        # La table MIME standard sert index.html en text/html ; `.apk` n'y
        # figure pas et tombe donc sur `default_type`, qui déclenche le
        # téléchargement au lieu d'une tentative d'ouverture.
        #
        # L'ancien `types { }` vidait la table : la page elle-même serait
        # partie en téléchargement comme une application.
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "no-cache";
    }

    # Les fichiers versionnés par Vite portent une empreinte dans leur nom :
    # ils peuvent être mis en cache indéfiniment.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html ne doit jamais être mis en cache, sinon un navigateur
    # continuerait de charger les anciens fichiers après une mise à jour.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}
