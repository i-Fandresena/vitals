# Déploiement de Vitals sur un VPS.
#
#   api-vitals.aura-plus.site  -> API NestJS
#   vitals.aura-plus.site      -> espace d'administration
#
# Caddy est préféré à nginx ici : il obtient et renouvelle seul les
# certificats Let's Encrypt, sans certbot ni tâche cron à surveiller. Sur un
# déploiement de cette taille, c'est une pièce en moins qui peut casser en
# silence — et un certificat expiré couperait la synchronisation de tous les
# centres.

name: vitals

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Force l'authentification par mot de passe même en local au conteneur.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backups:/backups
    # Aucun port publié : la base n'est joignable que depuis le réseau interne
    # de Docker. Des données de santé ne doivent jamais être exposées sur
    # l'internet public, même protégées par un mot de passe.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      # L'espace d'administration est la seule origine navigateur autorisée.
      # L'application mobile n'est pas soumise au CORS.
      CORS_ORIGINS: https://${ADMIN_DOMAIN}
    # Pas de port publié non plus : seul Caddy joint l'API.
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Fichiers de l'espace d'administration, déposés par le déploiement.
      - ./admin:/srv/admin:ro

volumes:
  db_data:
  caddy_data:
  caddy_config:
