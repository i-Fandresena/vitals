# Déploiement de Vitals sur le VPS qualitec-vps.
#
#   api-vitals.aura-plus.site  -> API NestJS
#   vitals.aura-plus.site      -> espace d'administration
#
# ⚠️ Ce serveur fait tourner Coolify, dont le proxy Traefik (`coolify-proxy`)
# détient déjà les ports 80 et 443 et sert une dizaine d'autres applications.
# Publier ces ports ici les casserait toutes. Vitals s'attache donc au réseau
# `coolify` et se déclare auprès de Traefik par des étiquettes, comme les
# autres applications du serveur — c'est aussi Traefik qui obtient les
# certificats Let's Encrypt.

name: vitals

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backups:/backups
    # Uniquement sur le réseau interne : la base n'est joignable ni depuis
    # l'internet, ni depuis les autres applications du serveur. Des données de
    # santé exposées publiquement sont un risque qu'aucun mot de passe ne
    # compense.
    networks:
      - interne
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      # L'espace d'administration est la seule origine navigateur autorisée.
      # L'application mobile n'est pas soumise au CORS.
      CORS_ORIGINS: https://${ADMIN_DOMAIN}
    networks:
      - interne
      - coolify
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify

      # http -> https
      traefik.http.routers.vitals-api-http.entryPoints: http
      traefik.http.routers.vitals-api-http.rule: Host(`${API_DOMAIN}`)
      traefik.http.routers.vitals-api-http.middlewares: vitals-redirect-https
      traefik.http.middlewares.vitals-redirect-https.redirectscheme.scheme: https

      traefik.http.routers.vitals-api-https.entryPoints: https
      traefik.http.routers.vitals-api-https.rule: Host(`${API_DOMAIN}`)
      traefik.http.routers.vitals-api-https.tls: "true"
      traefik.http.routers.vitals-api-https.tls.certresolver: letsencrypt
      traefik.http.routers.vitals-api-https.service: vitals-api
      traefik.http.services.vitals-api.loadbalancer.server.port: "3000"

  admin:
    build:
      context: ../admin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://${API_DOMAIN}/api/v1
    restart: unless-stopped
    volumes:
      # APK mis à disposition des centres. Déposés à la main après chaque
      # build signé, pas construits ici : la signature exige le keystore, qui
      # ne doit jamais se trouver sur le serveur.
      - ./telechargements:/usr/share/nginx/html/telechargement:ro
    networks:
      - coolify
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify

      traefik.http.routers.vitals-admin-http.entryPoints: http
      traefik.http.routers.vitals-admin-http.rule: Host(`${ADMIN_DOMAIN}`)
      traefik.http.routers.vitals-admin-http.middlewares: vitals-redirect-https

      traefik.http.routers.vitals-admin-https.entryPoints: https
      traefik.http.routers.vitals-admin-https.rule: Host(`${ADMIN_DOMAIN}`)
      traefik.http.routers.vitals-admin-https.tls: "true"
      traefik.http.routers.vitals-admin-https.tls.certresolver: letsencrypt
      traefik.http.routers.vitals-admin-https.service: vitals-admin
      traefik.http.services.vitals-admin.loadbalancer.server.port: "80"

networks:
  interne:
    driver: bridge
  # Réseau créé par Coolify. `external` : ce fichier s'y raccorde, il ne le
  # gère pas et ne doit surtout pas le supprimer.
  coolify:
    external: true

volumes:
  db_data:
